<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f6">
    <title>Juniper Table | Restaurant Operations</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Juniper Table home" data-view="overview">
          <span class="brand-mark">J</span>
          <span class="brand-copy"><strong>juniper</strong><small>TABLE &amp; KITCHEN</small></span>
        </a>
        <div class="restaurant-switcher">
          <span class="restaurant-avatar">JT</span>
          <span class="restaurant-name"><strong>Juniper Table</strong><small>Downtown · Main location</small></span>
          <span class="switcher-chevron">⌄</span>
        </div>
        <div class="nav-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="overview"><span class="nav-icon">◫</span>Overview</button>
          <button class="nav-item" data-view="orders"><span class="nav-icon">▤</span>Orders <span class="nav-count" id="open-order-count">0</span></button>
          <button class="nav-item" data-view="kitchen"><span class="nav-icon">♨</span>Kitchen</button>
          <button class="nav-item" data-view="menu"><span class="nav-icon">▧</span>Menu</button>
          <button class="nav-item" data-view="inventory"><span class="nav-icon">▦</span>Inventory</button>
          <button class="nav-item" data-view="team"><span class="nav-icon">♙</span>Employees</button>
          <button class="nav-item" data-view="reservations"><span class="nav-icon">▣</span>Reservations</button>
          <button class="nav-item" data-view="accounting"><span class="nav-icon">$</span>Accounting</button>
          <button class="nav-item" data-view="complaints"><span class="nav-icon">☷</span>Complaints</button>
          <button class="nav-item" data-view="reports"><span class="nav-icon">▥</span>Reports</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="service-card">
            <span class="service-dot"></span>
            <span><strong>Service is live</strong><small>Everything is running smoothly</small></span>
          </div>
          <button class="profile-button" data-action="profile">
            <span class="profile-avatar">AM</span>
            <span><strong>Alex Morgan</strong><small>Restaurant manager</small></span>
            <span class="profile-more">···</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Juniper Table</span><span class="crumb-divider">/</span><strong id="current-section">Overview</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button notification-button" aria-label="Notifications" data-action="notifications">♧<i></i><span id="notification-count" class="notification-count" hidden></span></button>
            <button class="button button-primary top-new-order" data-action="new-order"><span>＋</span> New order</button>
          </div>
        </header>
        <div id="app" class="page-content"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="mockData.js"></script>
    <script src="app.js"></script>
  </body>
</html>
